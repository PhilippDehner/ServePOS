services:
  database:
    image: postgres:18
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: posdb
    ports:
      - "5432:5432"
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d posdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Backend
      dockerfile: ServePOS.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Jwt__Issuer: ${Jwt__Issuer:-ServePOS}
      Jwt__Audience: ${Jwt__Audience:-ServePOS}
      Jwt__SigningKey: ${Jwt__SigningKey:?Set Jwt__SigningKey in .env to a random value with at least 32 characters}
      Jwt__ExpirationMinutes: ${Jwt__ExpirationMinutes:-60}
      BootstrapAdmin__Username: ${BootstrapAdmin__Username:?Set BootstrapAdmin__Username in .env}
      BootstrapAdmin__Pin: ${BootstrapAdmin__Pin:?Set BootstrapAdmin__Pin in .env}
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=posdb;Username=pos;Password=pos
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

  pgadmin:
    image: dpage/pgadmin4
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pos.de
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - database
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  database_data:
  pgadmin_data:
